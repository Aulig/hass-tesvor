filter:
  include_entities:
    - vacuum.tesvor_<device_id>_vacuum
    - sensor.tesvor_<device_id>_filter
    - sensor.tesvor_<device_id>_main_brush
    - sensor.tesvor_<device_id>_side_brush
    - sensor.tesvor_<device_id>_total_clean_area
    - sensor.tesvor_<device_id>_total_clean_time
    - sensor.tesvor_<device_id>_last_clean_area
    - sensor.tesvor_<device_id>_last_clean_duration

entity_config:
#====== tesvor_<device_id>_vacuum ==========

  vacuum.tesvor_<device_id>_vacuum:
    name: Пылесос Tesvor
    properties:
      - type: battery_level
        entity: vacuum.tesvor_<device_id>_vacuum
        attribute: battery_level

  sensor.tesvor_<device_id>_filter:
    name: HEPA фильтр
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_filter

  sensor.tesvor_<device_id>_main_brush:
    name: Основная щётка
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_main_brush

  sensor.tesvor_<device_id>_side_brush:
    name: Боковая щётка
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_side_brush

  sensor.tesvor_<device_id>_total_clean_area:
    name: Общая площадь уборки
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_total_clean_area

  sensor.tesvor_<device_id>_total_clean_time:
    name: Общее время уборки
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_total_clean_time

  sensor.tesvor_<device_id>_last_clean_area:
    name: Площадь последней уборки
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_last_clean_area

  sensor.tesvor_<device_id>_last_clean_duration:
    name: Время последней уборки
    properties:
      - type: float.meter
        entity: sensor.tesvor_<device_id>_last_clean_duration

#====== tesvor_<device_id>_vacuum ==========
